<!-- typography -->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Typography Bootstrap</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
  </head>
  <body class="p-5">
    <h1>Judul Besar (H1)</h1>
    <p class="lead">Ini teks besar sebagai pembuka.</p>

    <p class="fw-bold">Teks tebal.</p>
    <p class="fw-light">Teks tipis.</p>
    <p class="fst-italic">Teks miring.</p>

    <p class="text-decoration-underline">Teks garis bawah.</p>
    <p class="text-decoration-line-through">Teks dicoret.</p>

    <p class="text-primary">Teks biru (Primary).</p>
    <p class="text-danger">Teks merah (Danger).</p>
    <p class="text-success">Teks hijau (Success).</p>

    <p class="text-start">Rata kiri.</p>
    <p class="text-center">Rata tengah.</p>
    <p class="text-end">Rata kanan.</p>
  </body>
</html>
