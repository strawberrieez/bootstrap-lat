<!-- colors -->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Colors</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
  </head>
  <body class="p-5">
    <h1 class="text-center text-primary">Warna di Bootstrap</h1>

    <h3>🔹 Warna Teks</h3>
    <p class="text-primary">Teks biru (Primary)</p>
    <p class="text-danger">Teks merah (Danger)</p>
    <p class="text-success">Teks hijau (Success)</p>
    <p class="text-warning">Teks kuning (Warning)</p>

    <h3>🔹 Warna Background</h3>
    <div class="bg-info text-dark p-3">Background biru muda (Info)</div>
    <div class="bg-dark text-white p-3">Background hitam (Dark)</div>
    <div class="bg-light text-dark p-3">Background putih (Light)</div>

    <h3>🔹 Warna Border</h3>
    <div class="border border-primary p-3">Border biru</div>
    <div class="border border-danger p-3">Border merah</div>
  </body>
</html>
