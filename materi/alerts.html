<!-- alerts -->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Images</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
  </head>
  <body class="p-5">
    <!-- Alert Sukses -->
    <div class="alert alert-success" role="alert">Data berhasil disimpan!</div>

    <!-- Alert Informasi -->
    <div class="alert alert-info" role="alert">
      Anda memiliki 5 notifikasi baru.
    </div>

    <!-- Alert Peringatan -->
    <div class="alert alert-warning" role="alert">
      Waspada! Sistem akan melakukan pemeliharaan.
    </div>

    <!-- Alert Kesalahan -->
    <div class="alert alert-danger" role="alert">
      Terjadi kesalahan! Gagal mengirim data.
    </div>

    <!-- Alert dengan Tombol Tutup -->
    <div class="alert alert-primary alert-dismissible fade show" role="alert">
      Ini adalah pesan penting! Klik tombol di bawah untuk menutupnya.
      <button
        type="button"
        class="btn-close"
        data-bs-dismiss="alert"
        aria-label="Close"
      ></button>
    </div>
  </body>
</html>
