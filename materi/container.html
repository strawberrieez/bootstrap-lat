<!-- container -->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Belajar Bootstrap 5</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
  </head>
  <body>
    <div class="container bg-light text-dark p-5">
      <h1 class="text-center">Container Biasa</h1>
      <p>Ukurannya otomatis menyesuaikan dengan layar.</p>
    </div>

    <div class="container-fluid bg-primary text-white p-5 mt-3">
      <h1 class="text-center">Container Fluid</h1>
      <p>Selalu 100% lebar layar.</p>
    </div>

    <div class="container-md bg-success text-white p-5 mt-3">
      <h1 class="text-center">Container dengan Breakpoint</h1>
      <p>Lebar penuh di layar kecil, tapi punya batas di layar besar.</p>
    </div>
  </body>
</html>
