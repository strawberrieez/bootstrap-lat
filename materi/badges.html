<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Badges Bootstrap</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>

<div class="container mt-5">
    <h1>Contoh Badges</h1>

    <!-- Badge dalam teks -->
    <p>Pesanan Anda <span class="badge bg-success">Selesai</span></p>

    <!-- Badge dalam button -->
    <button type="button" class="btn btn-primary">
        Notifikasi <span class="badge bg-light text-dark">4</span>
    </button>

    <!-- Badge dengan pill (rounded) -->
    <p>Status: <span class="badge rounded-pill bg-warning text-dark">Pending</span></p>
</div>

<script src="bootstrap/js/bootstrap.bundle.min.js"></script>

</body>
</html>
