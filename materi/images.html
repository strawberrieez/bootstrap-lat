<!-- images -->
<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bootstrap Images</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
  </head>
  <body class="p-5">
    <h1 class="text-center text-primary">Gambar di Bootstrap</h1>

    <h3>📌 Gambar Responsif</h3>
    <img src="images/test.jpg" class="img-fluid" alt="Gambar Responsif" />

    <h3>🎯 Gambar Rounded</h3>
    <img src="images/test.jpg" class="img-fluid rounded" alt="Gambar Rounded" />

    <h3>🔵 Gambar Bulat</h3>
    <img
      src="images/test.jpg"
      class="img-fluid rounded-circle"
      alt="Gambar Bulat"
    />

    <h3>🖼 Gambar Thumbnail</h3>
    <img src="images/test.jpg" class="img-thumbnail" alt="Gambar Thumbnail" />

    <h3>📍 Gambar dengan Posisi</h3>
    <img
      src="images/test.jpg"
      class="img-fluid float-start"
      alt="Gambar Kiri"
    />
    <img src="images/test.jpg" class="img-fluid float-end" alt="Gambar Kanan" />
    <img
      src="images/test.jpg"
      class="img-fluid mx-auto d-block"
      alt="Gambar Tengah"
    />
  </body>
</html>
