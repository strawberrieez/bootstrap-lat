<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alo aku Sekar :3</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
  </head>
  <body>
    <!-- gambar responsive -->
    <img src="images/example.jpg" class="img-fluid" alt="Responsive image" />

    <!-- efek border buat thumbnail -->
    <img src="images/example.jpg" class="img-thumbnail" alt="Thumbnail image" />

    <!-- pinggirnya rounded -->
    <img src="images/example.jpg" class="rounded" alt="Rounded image" />

    <!-- bentuk circle -->
    <img src="images/example.jpg" class="rounded-circle" alt="Circle image" />

    <!-- mengapung -->
    <img src="images/example.jpg" class="float-start" alt="Float left" />
    <img src="images/example.jpg" class="float-end" alt="Float right" />
    <img src="images/example.jpg" class="mx-auto d-block" alt="Centered image"/>

    <!-- berbentuk row column dan responsive -->
    <div class="row">
      <div class="col-md-4">
        <img src="images/example1.jpg" class="img-fluid" alt="Image 1" />
      </div>
      <div class="col-md-4">
        <img src="images/example2.jpg" class="img-fluid" alt="Image 2" />
      </div>
      <div class="col-md-4">
        <img src="images/example3.jpg" class="img-fluid" alt="Image 3" />
      </div>
    </div>
  </body>
</html>
