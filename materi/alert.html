<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Alo aku Sekar :3</title>
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css" />
  </head>
  <body>
    <!-- Alert Sederhana -->
    <div class="alert alert-primary">Ini adalah alert berwarna biru!</div>
    <div class="alert alert-success">Berhasil! Aksi sukses dilakukan.</div>
    <div class="alert alert-danger">Error! Terjadi masalah.</div>

    <!-- Alert dengan Tombol Close -->
    <div class="alert alert-warning alert-dismissible fade show">
      <strong>Peringatan!</strong> Periksa kembali input Anda.
      <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Alert dengan Link -->
    <div class="alert alert-info">
      Baca lebih lanjut di <a href="#" class="alert-link">sini</a>.
    </div>
  </body>
</html>
