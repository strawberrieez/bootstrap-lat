<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tutorial Bootstrap5 by SEKAR</title>

    <!-- instalasi by CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <!-- instalasi by Manual -->
    <!-- **install di bootstrap.com, download, extract folder, copy folder bootstrap ke folder project -->
    <link rel="stylesheet" href="bootstrap/css/bootstrap.min.css">
</head>
<body>

    <!-- container -->
    <div class="container bg-dark text-white">
        <h1 class="text-center">container biasa</h1>
    </div>

    <!-- typography -->
    <h1>ini h1</h1>
    <h2>ini h2</h2>
    <h3>ini h3</h3>
    <h4>ini h4</h4>
    <h5>ini h5</h5>
    <h6>ini h6</h6>

    <!-- colors -->
    <p class="text-danger">Teks merah</p>
    <p class="text-success">Teks hijau</p>

    <div class="bg-dark text-white p-3">Background hitam</div>
    <div class="bg-light text-dark p-3">Background putih</div>

    <!-- images -->
    <img src="images/test.jpg" class="img-fluid" alt="Gambar Responsif" />

    <!-- alerts -->
    <!--** Alert Sukses -->
    <div class="alert alert-success" role="alert">Data berhasil disimpan!</div>
    <!--** Alert Informasi -->
    <div class="alert alert-info" role="alert">Anda memiliki notifikasi baru.</div>
    <!--** Alert Peringatan -->
    <div class="alert alert-warning" role="alert">Sistem akan melakukan pemeliharaan pada pukul 00.00.</div>
    <!--** Alert Kesalahan -->
    <div class="alert alert-danger" role="alert">Terjadi kesalahan! Gagal mengirim data.</div>

    <!-- buttons -->
    <button type="button" class="btn btn-success">Simpan</button>
    <button type="button" class="btn btn-danger">Batal</button>

    <!-- badges -->
    <button type="button" class="btn btn-primary">Notifikasi<span class="badge text-bg-secondary">4</span></button>

    <!-- spinners -->
    <!--** Border spinner -->
    <div class="spinner-border" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>

    <!--** Growing spinner -->
    <div class="spinner-grow" role="status">
        <span class="visually-hidden">Loading...</span>
    </div>
</div>
</html>
